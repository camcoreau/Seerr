name: CamCore Seerr Image

on:
  push:
    branches:
      - develop
      - 'agent/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camcore-seerr-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: camcoreau/seerr

jobs:
  validate:
    name: Validate CamCore fork
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install --frozen-lockfile

      - name: Compile CamCore email templates
        run: |
          node <<'NODE'
          const path = require('node:path');
          const pug = require('pug');

          const templates = [
            'generatedpassword',
            'media-issue',
            'media-request',
            'resetpassword',
            'test-email',
          ];

          for (const template of templates) {
            const file = path.join(
              process.cwd(),
              'server',
              'templates',
              'email',
              template,
              'html.pug'
            );
            pug.compileFile(file, { filename: file });
            console.log(`Compiled ${template}`);
          }
          NODE

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        env:
          CI: true
        run: pnpm test

      - name: Build application
        env:
          CI: true
        run: pnpm build

  build-and-publish:
    name: Build and publish AMD64 image
    if: github.ref == 'refs/heads/develop'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=camcore
            type=sha,prefix=develop-
          labels: |
            org.opencontainers.image.title=CamCore Cameron-Media Requests
            org.opencontainers.image.description=CamCore-branded Seerr image for Cameron-Media Requests
            org.opencontainers.image.source=https://github.com/camcoreau/Seerr

      - name: Build and publish image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
          cache-from: type=gha,scope=camcore-amd64
          cache-to: type=gha,mode=max,scope=camcore-amd64
          provenance: false
